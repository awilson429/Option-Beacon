# FastAPI read-only API. Keep this service PRIVATE: do not attach a public
# Railway domain. Healthchecks use PORT internally and do not require one.
# One Uvicorn process only — do not set replica count above 1.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m uvicorn api.main:app --host :: --port $PORT"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
