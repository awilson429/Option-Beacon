# Next.js public UI. Railway service Root Directory must be `frontend`.
# Config-as-code path: railway.frontend.toml (repository root).
# Attach a public domain to this service. Do not copy OPTIONBEACON_API_ORIGIN
# into a NEXT_PUBLIC_ variable.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build"

[deploy]
startCommand = "pnpm exec next start --hostname 0.0.0.0 --port $PORT"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
